[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 2000
via_ir = true
bytecode_hash = "none"
cbor_metadata = true
fs_permissions = [{ access = "read", path = "./" }, { access = "write", path = "./deployments" }]

[profile.default.fuzz]
runs = 10000

[rpc_endpoints]
xlayer = "${XLAYER_RPC}"
